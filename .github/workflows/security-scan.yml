name: Security Scan

on:
  push:
    branches: [main, phase-*]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan
    - cron: "0 6 * * 1"

jobs:
  security-scan:
    name: Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Check for dependency vulnerabilities
        run: |
          cd backend
          pip-audit --desc --progress-spinner off || echo "Vulnerabilities found — review above output"

      - name: Scan for hardcoded secrets
        run: |
          # Check for common secret patterns in tracked files
          echo "Scanning for hardcoded secrets..."
          FOUND=0
          for pattern in \
            "sk-[a-zA-Z0-9]{20,}" \
            "ghp_[a-zA-Z0-9]{36}" \
            "AKIA[0-9A-Z]{16}" \
            "password\s*=\s*['\"][^'\"]{8,}['\"]" \
            "api_key\s*=\s*['\"][^'\"]{10,}['\"]"; do
            if git grep -l -E "$pattern" -- '*.py' '*.yml' '*.yaml' '*.json' '*.toml' 2>/dev/null; then
              echo "WARNING: Potential secret found matching pattern: $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "Secrets detected — review and remediate before merging"
            exit 1
          fi
          echo "No hardcoded secrets found in tracked files"

      - name: Run security test suite
        run: |
          cd backend
          python -m pytest tests/test_tenant_isolation_adversarial.py tests/test_agent_prompt_injection.py tests/test_auth.py tests/test_rbac.py -v --tb=short

      - name: Verify .env not committed
        run: |
          if git ls-files '*.env' | grep -v '.env.example'; then
            echo "ERROR: .env file committed to repository"
            exit 1
          fi
          echo "OK: No .env files in repository"

      - name: Verify secrets not in git history
        run: |
          # Check for API keys in recent commits (last 50)
          if git log --oneline -50 -p | grep -E "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16})"; then
            echo "WARNING: Potential secrets found in recent git history"
            exit 1
          fi
          echo "OK: No secrets in recent git history"
